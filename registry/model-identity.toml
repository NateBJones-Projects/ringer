# ─── EPAM DIAL lane ──────────────────────────────────────────────────────
# Local site entry, not upstream: these routes reach EPAM's internal DIAL
# gateway (https://ai-proxy.lab.epam.com) and mean nothing on another machine.
#
# HARNESS is OpenCode, not "DIAL". DIAL is the ACCESS path — an Azure-style
# gateway that routes on the deployment in the URL. It is never a lab and
# never a model. The engine is named `dial` in config.toml; that name must
# not leak into the Model or Lab column.
#
# WHY EVERY MODEL KEY IS AN ALIAS. The key is the manifest/config model slug,
# and these slugs deliberately avoid the strings "claude" and "anthropic".
# OpenCode stamps Anthropic prompt-caching blocks whenever a model id matches
# those; against an OpenAI-compatible endpoint that emits a raw
# `cache_control` field, which DIAL rejects with HTTP 400. DIAL ignores the
# body's model name (it routes on the URL path), so the rename is free and
# the lineage stays fully established — hence a real display name here rather
# than an "(alias)" marker. Same pattern as engines.grok's `grok-build` key,
# which is a CLI name displaying as Grok 4.5.
#
# Each provider block in ~/.config/opencode/opencode.json pins exactly one
# DIAL deployment in its baseURL; that deployment id is the evidence below.
# Deployment ids confirmed 2026-09-02 against
# GET https://ai-proxy.lab.epam.com/openai/deployments (143 entitled).
[engines.dial]
harness = "OpenCode"
access = "EPAM DIAL"
default_model_key = "dial/dial-sonnet-45"

[engines.dial.models."dial/dial-sonnet-45"]
display = "Claude Sonnet 4.5"
lab = "Anthropic"
confidence = "verified"
source = "DIAL deployment claude-sonnet-4-5@20250929 pinned in the opencode provider baseURL; lab per https://www.anthropic.com/claude"
last_verified = 2026-09-02

[engines.dial.models."dial-haiku/haiku-45"]
display = "Claude Haiku 4.5"
lab = "Anthropic"
confidence = "verified"
source = "DIAL deployment claude-haiku-4-5@20251001 pinned in the opencode provider baseURL; lab per https://www.anthropic.com/claude"
last_verified = 2026-09-02

[engines.dial.models."dial-sonnet5/sonnet-5"]
display = "Claude Sonnet 5"
lab = "Anthropic"
confidence = "verified"
source = "DIAL deployment claude-sonnet-5@default pinned in the opencode provider baseURL; lab per https://www.anthropic.com/claude"
last_verified = 2026-09-02

# WITHDRAWN 2026-09-04. The opencode provider `dial-codex` was removed, so this
