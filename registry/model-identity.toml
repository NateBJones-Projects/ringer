# call, and OpenCode retries a 429 without emitting an event, so a task on this
# lane burns its whole timeout with an empty log. Three logged tasks failed that
# way. The entry stays so those rows keep their identity on the scoreboard.
# To restore it: confirm a direct call returns 200, then re-add the provider
